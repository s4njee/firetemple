<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Temple</title>
    <!-- Inline, so no browser goes looking for /favicon.ico and logs a 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230c0a09'/%3E%3Cpath d='M8 2c1 2.5 3.5 4 3.5 7A3.5 3.5 0 0 1 8 12.5 3.5 3.5 0 0 1 4.5 9c0-1.5 1-2.5 1.5-3.5.5 1 1 1.5 1.5 1.500C7.500 5.500 7.500 3.500 8 2z' fill='%23ff8a3d'/%3E%3C/svg%3E"
    />
    <script>
      // Before first paint, so a stored theme never flashes the other one.
      try {
        const theme = localStorage.getItem('ft-theme');
        if (theme === 'light' || theme === 'auto') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
